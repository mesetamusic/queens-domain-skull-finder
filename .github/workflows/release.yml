# Builds SkullFinder.exe on GitHub's Windows runners.
#  - Push a tag like "v1.0"      -> builds and publishes a GitHub Release with the zip attached.
#  - Run it manually (Actions tab) -> builds and uploads the zip as a downloadable artifact only.
name: Build & release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: pip install pyinstaller==6.22.3

      - name: Build exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name SkullFinder --icon skull.ico --add-data "skull.ico;." SkullFinder.pyw

      - name: Zip
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq "tag") { "SkullFinder-$env:GITHUB_REF_NAME.zip" } else { "SkullFinder-dev.zip" }
          Compress-Archive -Path dist/SkullFinder.exe, README.txt -DestinationPath $name
          "ZIP=src/$name" | Out-File -Append $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: SkullFinder
          path: ${{ env.ZIP }}

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
